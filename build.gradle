// Builds the AEON R2 processor extension. The shared part of the build, settings included,
// is gradle/ghidra-plugin-common.gradle; this file holds only what is AEON's own.

apply from: 'gradle/ghidra-plugin-common.gradle'

// The vendor toolchain, the dumped ISA tables and the generator are how the spec is produced,
// not part of what ships. Fixtures are proprietary firmware belonging to another session.
buildExtension.exclude 'vendor/**'
buildExtension.exclude 'isa/**'
buildExtension.exclude 'tools/**'
buildExtension.exclude 'fixtures/**'
buildExtension.exclude 'fixtures-out/**'
buildExtension.exclude '*.rawlob'

// A processor module ships its language and its function-start patterns.
allowPackaged 'data/', 'data/languages/', 'data/patterns/',
	'data/languages/[^/]+\\.(slaspec|sinc|sla|ldefs|pspec|cspec)',
	'data/patterns/[^/]+\\.xml'

// ---------------------------------------------------------------- sleigh --
// The stock extension build never compiles a .slaspec, so a spec error would
// only surface when Ghidra loads the language. Compile here instead, with the
// conflict/quality checks on, so a bad spec fails the build.
//   -l  report pattern conflicts   -c  colliding operands
//   -n  NOP constructors           -u  unnecessary p-code
//   -t  dead temporaries           -f  unused token fields
def sleighSettingsDir = layout.buildDirectory.dir('sleigh-settings')

tasks.register('compileSleigh', Exec) {
	group = 'Ghidra'
	description = 'Compile every AEON language; fails the build on a spec error'
	inputs.files fileTree('data/languages') {
		include '**/*.slaspec'
		include '**/*.sinc'
	}
	outputs.files file('data/languages/aeonR2.sla'), file('data/languages/aeonR2le.sla'),
		file('data/languages/aeonR2le_harvard.sla')
	doFirst { sleighSettingsDir.get().asFile.mkdirs() }
	// support/sleigh ignores GHIDRA_JAVA_OPTIONS, but honours XDG_CONFIG_HOME
	// (measured by ghidra-plugin-keil8051), which keeps its logs out of
	// ~/.config/ghidra. Linux-only, which is what this repo builds on.
	environment 'XDG_CONFIG_HOME', "${sleighSettingsDir.get().asFile}"
	// -a compiles every .slaspec in the directory: aeonR2 (-EB), aeonR2le (-EL)
	// and aeonR2le_harvard (-EL, data in its own space)
	commandLine "${ghidraInstallDir}/support/sleigh", '-l', '-c', '-n', '-u', '-t', '-f',
		'-a', 'data/languages'
}

tasks.named('buildExtension') { dependsOn 'compileSleigh' }

// The JUnit tests build programs in the AEON languages, so they need the compiled
// .sla files and this repo registered as a Ghidra module (see AeonAddressAnalyzerTest).
tasks.named('test') {
	dependsOn 'compileSleigh'
	systemProperty 'ghidra.external.modules', projectDir.absolutePath
}

// ------------------------------------------------- committed-sample checks --
// smokeTest decodes the committed sample and compares it with the vendor objdump;
// emuTest replays the vendor simulator's cases (tools/gen_emu_cases.py) through
// Ghidra's p-code emulator, so the semantics are checked against MStar's own
// model of the hardware. One of each per language.
def smokeSample = file('src/test/smoke/smoke.bin')

// Rebuilds smoke.bin and smoke.objdump from smoke.s. Local only: it needs the
// vendor toolchain in vendor/, which CI does not have, so CI checks the committed
// outputs instead.
tasks.register('generateSmokeSample', Exec) {
	description = 'Reassemble the smoke sample from src/test/smoke/smoke.s with the vendor toolchain'
	commandLine 'python3', file('src/test/smoke/generate.py').absolutePath
}

[
	['', 'AEON:BE:32:R2', 'the big-endian-data language', 'emu_cases.json'],
	['Le', 'AEON:LE:32:R2', 'the little-endian-data language', 'emu_cases_le.json'],
	// the -EL cases with every load and store in the data space: the results only
	// match if stores and the loads that read them back agree on the space
	['Harvard', 'AEON:LE:32:R2-harvard', 'the Harvard language', 'emu_cases_le.json'],
].each { variant, language, what, cases ->
	// the script seeds the entry and runs analysis itself: a raw image has no entry point
	ghidraHeadless("smokeTest${variant}") {
		description = "Decode, analyse and decompile the committed sample with ${what}"
		importFile = smokeSample
		processor = language
		noAnalysis = true
		args '-loader', 'BinaryLoader', '-loader-baseAddr', '0x200000'
		postScript 'AeonSmoke.java', file('src/test/smoke/smoke.objdump').absolutePath
		requiredLine = 'SMOKE OK'
	}
	ghidraHeadless("emuTest${variant}") {
		description = "Replay the vendor simulator's cases through the p-code emulator, with ${what}"
		importFile = smokeSample
		processor = language
		noAnalysis = true
		postScript 'AeonEmuTest.java', file("src/test/smoke/${cases}").absolutePath
		requiredLine = 'EMU OK'
	}
	tasks.named('verify') { dependsOn "smokeTest${variant}", "emuTest${variant}" }
}

// --------------------------------------------------------- real-target checks --
// Local only, never in verify: the fixtures are proprietary firmware belonging to
// the hp-z27k-g3 session and are not committed here. MStar firmware is built -EL
// (little-endian data), so these default to that language; -PaeonLanguage selects
// another.
def fixtureLanguage = findProperty('aeonLanguage') ?: 'AEON:LE:32:R2'
def disabledAnalyzers = findProperty('aeonDisable')?.toString()?.split(',')?.toList() ?: []

// Census of what flow-based disassembly actually reaches, which is the list
// that says whether a pseudo-op is worth real p-code:
//   ./gradlew census -PaeonFixture=fixtures/hdcp.bin -PaeonSeeds=<file> -PaeonBase=0x157000
// Entry-point lists for the firmware fixtures are not in the repo; generate one
// with tools/jal_targets.py.
ghidraHeadless('census') {
	description = 'Count the instructions real control flow reaches in a fixture'
	importFile = findProperty('aeonFixture') ?: 'fixtures/sboot.bin'
	importSwitch = 'aeonFixture'
	processor = fixtureLanguage
	args '-loader', 'BinaryLoader', '-loader-baseAddr', findProperty('aeonBase') ?: '0x0'
	if (disabledAnalyzers) {
		preScript 'AeonDisableAnalyzers.java', *disabledAnalyzers
	}
	postScript 'AeonCensus.java',
		"seed=${file(findProperty('aeonSeeds') ?: 'src/test/fixtures/sboot_entries.txt')}"
	requiredLine = 'CENSUS DONE'
	failPattern = null
	echo = true
}

// What a reader actually sees. A clean listing and correct p-code do not mean
// the decompiler produces anything sane, so this runs it over every function:
//   ./gradlew decompileCheck -PaeonFixture=… -PaeonSeeds=… -PaeonBase=… [-PaeonShow=0x…]
// -PaeonDisable='A,B' turns those analyzers off, to see what a result depends on.
ghidraHeadless('decompileCheck') {
	description = 'Decompile every function in a fixture and report failures and warnings'
	importFile = findProperty('aeonFixture') ?: 'fixtures/hdcp.bin'
	importSwitch = 'aeonFixture'
	processor = fixtureLanguage
	args '-loader', 'BinaryLoader', '-loader-baseAddr', findProperty('aeonBase') ?: '0x157000'
	if (disabledAnalyzers) {
		preScript 'AeonDisableAnalyzers.java', *disabledAnalyzers
	}
	def scriptArgs = ["seed=${file(findProperty('aeonSeeds') ?: 'src/test/fixtures/sboot_entries.txt')}"]
	if (hasProperty('aeonFunctions')) {
		scriptArgs << "functions=${file(property('aeonFunctions'))}"
	}
	if (hasProperty('aeonShow')) {
		scriptArgs << "show=${property('aeonShow')}"
	}
	postScript 'AeonDecompileCheck.java', *scriptArgs
	requiredLine = 'DECOMPILE CHECK DONE'
	failPattern = null
	echo = true
}

// Full linear-sweep diff of a fixture against the vendor objdump listing:
//   ./gradlew acceptanceTest -PaeonFixture=fixtures/sboot.bin \
//                            -PaeonListing=fixtures-out/sboot.asm
def acceptanceFixture = file(findProperty('aeonFixture') ?: 'fixtures/sboot.bin')
def acceptanceDump = layout.buildDirectory.file("smoke/${acceptanceFixture.name}.ghidra.txt")

ghidraHeadless('acceptanceDump') {
	description = 'Linear-sweep disassembly of a fixture, for the acceptance diff'
	importFile = acceptanceFixture
	importSwitch = 'aeonFixture'
	processor = fixtureLanguage
	noAnalysis = true
	postScript 'AeonDumpDisasm.java', acceptanceDump.get().asFile.absolutePath
	requiredLine = 'DUMP DONE'
	outputs.file acceptanceDump
}

tasks.register('acceptanceTest', Exec) {
	group = 'verification'
	description = 'Diff the Ghidra disassembly against the vendor objdump, address by address'
	dependsOn 'acceptanceDump'
	def listing = file(findProperty('aeonListing') ?:
		"fixtures-out/${acceptanceFixture.name.replaceAll(/\.bin$/, '')}.asm")
	doFirst {
		if (!listing.exists()) {
			throw new GradleException("objdump listing not found: ${listing} (set -PaeonListing=<path>)")
		}
	}
	// exits non-zero on any unexplained difference
	commandLine 'python3', file('tools/acceptance.py').absolutePath,
		listing.absolutePath, acceptanceDump.get().asFile.absolutePath
}


// What analysis referenced, by target space: the Harvard check for the address analyzer.
//   ./gradlew checkRefs -PaeonFixture=fixtures/stream0.bin -PaeonBase=0x300000 \
//                       -PaeonSeeds=src/test/fixtures/stream0_entries.txt -PaeonLanguage=…
ghidraHeadless('checkRefs') {
	description = 'Report the references analysis made in a fixture, by target space'
	importFile = findProperty('aeonFixture') ?: 'fixtures/sboot.bin'
	importSwitch = 'aeonFixture'
	processor = fixtureLanguage
	noAnalysis = true
	args '-loader', 'BinaryLoader', '-loader-baseAddr', findProperty('aeonBase') ?: '0x0'
	postScript 'AeonCheckRefs.java',
		"seed=${file(findProperty('aeonSeeds') ?: 'src/test/fixtures/sboot_entries.txt')}"
	requiredLine = 'in-memory data refs'
	failPattern = null
	echo = true
}
